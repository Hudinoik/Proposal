# XcodeGen spec for the iOS app. CI runs `xcodegen generate` here after
# copying ../index.html into Resources/ (never commit that copy — the root
# index.html stays the single source, same rule as electron/index.html).
name: TCOAgreementGenerator
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  TCOAgreementGenerator:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
      - path: Assets.xcassets
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tco.agreementgenerator
        PRODUCT_NAME: TCO Agreement Generator
        MARKETING_VERSION: "1.1.4"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: TCO Agreements
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
