<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCO Agreement Generator</title>
<style>
  :root{
    color-scheme:light;
    --navy:#052B6A;
    --navy-2:#0A3A85;
    --lime:#8EB91A;
    --lime-dark:#5F7E10;
    --ink:#1c2433;
    --muted:#5c6675;
    --faint:#8a93a3;
    --bg:#f4f5f8;
    --card:#ffffff;
    --line:#dfe3ea;
    --line-soft:#e9edf3;
    --danger:#a4322a;
    --radius:6px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}

  /* ============ APP CHROME ============ */
  .topbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 22px;position:sticky;top:0;z-index:50;border-bottom:3px solid var(--lime)}
  .topbar img.logo{height:42px;width:42px;object-fit:contain;background:#fff;border-radius:50%;padding:3px}
  .topbar .tt{line-height:1.2}
  .topbar .tt b{font-size:16px;display:block;font-weight:600;letter-spacing:.2px}
  .topbar .tt span{font-size:11px;opacity:.75;letter-spacing:.8px;text-transform:uppercase}
  .topbar .spacer{flex:1}
  .tabs{display:flex;gap:2px;margin-right:14px}
  .tabs button{background:transparent;border:none;color:rgba(255,255,255,.75);padding:9px 16px;font-size:13.5px;cursor:pointer;font-weight:600;border-radius:var(--radius)}
  .tabs button:hover{color:#fff}
  .tabs button.active{background:rgba(255,255,255,.14);color:#fff}
  .btn{border:1px solid transparent;border-radius:var(--radius);padding:8px 16px;font-size:13.5px;font-weight:600;cursor:pointer;background:#fff;color:var(--navy);border-color:var(--line)}
  .btn:hover{border-color:var(--navy);background:#fff}
  .btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
  .btn.primary:hover{background:var(--navy-2)}
  .btn.accent{background:var(--lime);color:#12300a;border-color:var(--lime)}
  .btn.accent:hover{filter:brightness(1.04)}
  .btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}
  .btn.quiet:hover{color:var(--navy);background:var(--line-soft)}
  .btn.danger{background:transparent;color:var(--danger);border-color:transparent}
  .btn.danger:hover{background:#faece9;border-color:#f0d4d0}
  .btn.sm{padding:5px 11px;font-size:12.5px}
  .btn:disabled{opacity:.5;cursor:default}

  .layout{display:flex;gap:20px;padding:20px 22px;max-width:1780px;margin:0 auto;align-items:flex-start}
  .pane-form{flex:1 1 46%;min-width:430px;max-width:780px}
  .pane-preview{flex:1 1 54%;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;border-radius:8px;background:#d3d9e3;padding:26px}
  @media (max-width:1100px){
    .layout{flex-direction:column}
    .pane-form{max-width:none;min-width:0;width:100%}
    .pane-preview{position:static;max-height:none;width:100%}
  }

  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px 22px;margin-bottom:14px}
  .step-h{display:flex;align-items:baseline;gap:10px;margin:0 0 3px}
  .step-h .no{font-size:11px;font-weight:700;color:var(--lime-dark);letter-spacing:1.2px;text-transform:uppercase}
  .step-h h3{margin:0;color:var(--navy);font-size:16px;font-weight:600}
  .card p.hint{margin:2px 0 14px;color:var(--muted);font-size:13px}
  .frow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .field{flex:1;min-width:170px}
  .field.w100{flex-basis:100%}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--navy);margin-bottom:4px;letter-spacing:.2px}
  .field .sub{font-weight:400;color:var(--faint)}
  input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;font-family:inherit;background:#fff;color:var(--ink)
  }
  textarea{resize:vertical;min-height:64px;line-height:1.45}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(5,43,106,.12)}
  .checkline{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}
  .checkline input{width:auto;accent-color:var(--navy)}
  input[type=checkbox]{accent-color:var(--navy)}

  /* service picker */
  .svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .svc-card{position:relative;border:1px solid var(--line);border-radius:8px;padding:13px 14px 13px 15px;cursor:pointer;background:#fff;display:flex;gap:11px;align-items:center;user-select:none}
  .svc-card:hover{border-color:var(--navy)}
  .svc-card .ic{flex:0 0 auto;color:var(--navy);opacity:.85;display:flex}
  .svc-card .nm{font-weight:600;color:var(--navy);font-size:13.5px;line-height:1.3}
  .svc-card .tick{position:absolute;top:8px;right:9px;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--line);background:#fff}
  .svc-card.sel{border-color:var(--lime-dark);background:#fafcf3}
  .svc-card.sel .tick{background:var(--lime);border-color:var(--lime-dark)}
  .svc-card.sel .tick::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid #1d3305;border-width:0 2px 2px 0;transform:rotate(42deg)}

  /* fee lines */
  .fee-line{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:#fbfcfe}
  .fee-line .fl-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .fee-line .fl-head .tag{color:var(--lime-dark);font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border-bottom:2px solid var(--lime);padding-bottom:2px}
  .fee-line .fl-head .grow{flex:1}
  .addmenu{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
  .proj-row{display:flex;gap:8px;margin-bottom:6px;align-items:center}
  .proj-row input.desc{flex:3}
  .proj-row input.num{flex:1;min-width:70px}
  .tier-row{display:flex;gap:8px;margin-bottom:6px;align-items:center}
  .tier-row input.lbl{flex:2}
  .tier-row input.num{flex:1;min-width:80px}
  .tier-row input.note{flex:3}
  .totals-chip{display:inline-block;background:#f2f5fa;border:1px solid var(--line);color:var(--navy);border-radius:var(--radius);padding:6px 12px;font-size:12.5px;font-weight:600;margin:4px 6px 0 0}

  details.cust{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff}
  details.cust>summary{cursor:pointer;padding:10px 14px;font-weight:600;color:var(--navy);font-size:13.5px;list-style:none;display:flex;align-items:center;gap:9px}
  details.cust>summary::before{content:"";width:7px;height:7px;border:solid var(--faint);border-width:0 1.5px 1.5px 0;transform:rotate(-45deg);transition:transform .15s;margin-top:-2px}
  details.cust[open]>summary::before{transform:rotate(45deg);margin-top:-4px}
  details.cust .inner{padding:4px 14px 14px}
  .subgroup{font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--lime-dark);margin:14px 0 6px}

  .banner-warn{background:#fdf8ec;border:1px solid #e7d8a8;color:#6b5613;border-radius:8px;padding:11px 15px;font-size:13px;margin-bottom:14px}
  .banner-ai{background:#f2f7fd;border:1px solid #c9dcf2;color:#1c3a63;border-radius:8px;padding:11px 15px;font-size:13px;margin-bottom:12px}
  .banner-ai b{color:var(--navy)}
  .status-line{font-size:13px;margin-top:8px;color:var(--muted)}
  .status-line.err{color:var(--danger)}
  .status-line.ok{color:var(--lime-dark)}

  /* settings */
  .settings-wrap{max-width:900px;margin:0 auto;padding:20px 22px}
  .pkg-box{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#fbfcfe}
  .rate-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .rate-row input,.rate-row select{flex:1;min-width:90px}
  .rate-row .lbl{flex:2;min-width:150px}
  .set-h{margin:0 0 3px;color:var(--navy);font-size:16px;font-weight:600}

  /* ============ DOCUMENT (screen preview + print) ============ */
  .doc{background:#fff;max-width:816px;margin:0 auto;padding:60px 68px;box-shadow:0 2px 14px rgba(15,25,50,.28);font-family:Georgia,"Times New Roman",serif;color:#161c28;font-size:14.5px;line-height:1.55}
  .doc .dhead{display:flex;align-items:center;gap:18px;border-bottom:4px solid var(--lime);padding-bottom:18px;margin-bottom:26px}
  .doc .dhead img{height:86px;width:86px;object-fit:contain}
  .doc .dhead .ht{flex:1}
  .doc .dhead h1{margin:0;color:var(--navy);font-size:24px;line-height:1.25;font-family:"Segoe UI",system-ui,Arial,sans-serif}
  .doc .dhead .tagline{color:var(--lime-dark);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-top:5px;font-family:"Segoe UI",system-ui,Arial,sans-serif}
  .doc .parties{margin-bottom:8px}
  .doc .parties p{margin:4px 0}
  .doc h2{color:var(--navy);font-size:16.5px;margin:26px 0 8px;font-family:"Segoe UI",system-ui,Arial,sans-serif;border-bottom:1.5px solid var(--lime);padding-bottom:4px;break-after:avoid;page-break-after:avoid}
  .doc h4{color:var(--navy);font-size:14.5px;margin:14px 0 5px;font-family:"Segoe UI",system-ui,Arial,sans-serif;break-after:avoid;page-break-after:avoid}
  .doc p{margin:7px 0}
  .doc ul{margin:6px 0 10px;padding-left:26px}
  .doc li{margin:3.5px 0}
  .doc .note{color:#39424f;font-style:italic}
  .doc table.proj{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:13.5px}
  .doc table.proj th{background:var(--navy);color:#fff;text-align:left;padding:6px 10px;font-family:"Segoe UI",system-ui,Arial,sans-serif;font-size:12.5px}
  .doc table.proj td{border-bottom:1px solid #dfe4ec;padding:6px 10px}
  .doc table.proj td.r,.doc table.proj th.r{text-align:right;white-space:nowrap}
  .doc table.proj tr.sub td{font-weight:700;border-top:2px solid var(--navy);border-bottom:none}
  .doc table.proj tr.grand td{font-weight:700;color:var(--navy);font-size:15px;border-bottom:none}
  .doc .feetotals{background:#f6f9ec;border:1.5px solid var(--lime);border-radius:6px;padding:10px 16px;margin:14px 0}
  .doc .feetotals p{margin:4px 0;font-weight:600}
  .doc .price{color:var(--navy);font-weight:700}
  .doc .sig{margin-top:14px}
  .doc .sig .sgrid{display:flex;gap:40px;margin-top:16px}
  .doc .sig .scol{flex:1}
  .doc .sig .scol b{display:block;margin-bottom:14px;color:var(--navy);font-family:"Segoe UI",system-ui,Arial,sans-serif;font-size:13.5px}
  .doc .sig .sline{margin:22px 0 4px;border-bottom:1px solid #444}
  .doc .sig .slbl{font-size:12px;color:#555}
  .doc .dfoot{margin-top:34px;border-top:2px solid var(--lime);padding-top:10px;text-align:center;font-size:11.5px;color:#4a5468;font-family:"Segoe UI",system-ui,Arial,sans-serif}
  .doc .empty-hint{color:#8b93a5;text-align:center;padding:60px 20px;font-family:"Segoe UI",system-ui,Arial,sans-serif}
  .doc .keep{break-inside:avoid;page-break-inside:avoid}

  /* ============ PRINT ============ */
  @page{size:letter;margin:0.7in 0.75in}
  @media print{
    body{background:#fff}
    .topbar,.pane-form,.settings-wrap,.noprint{display:none !important}
    .layout{display:block;padding:0}
    .pane-preview{position:static;max-height:none;overflow:visible;background:#fff;padding:0;box-shadow:none;border-radius:0}
    .doc{box-shadow:none;max-width:none;padding:0;margin:0}
  }
</style>
</head>
<body>

<div class="topbar noprint">
  <img class="logo" id="topLogo" alt="TCO logo">
  <div class="tt"><b>TCO Agreement Generator</b><span id="topTag">Secretarial · Bookkeeping · Payroll · Office Services</span></div>
  <div class="spacer"></div>
  <div class="tabs">
    <button id="tabNew" class="active" onclick="showView('new')">New Agreement</button>
    <button id="tabSettings" onclick="showView('settings')">Settings</button>
  </div>
  <button class="btn accent" onclick="doPrint()">Save as PDF</button>
</div>

<!-- ================= NEW AGREEMENT VIEW ================= -->
<div id="viewNew" class="layout">
  <div class="pane-form" id="formPane"></div>
  <div class="pane-preview"><div id="preview"></div></div>
</div>

<!-- ================= SETTINGS VIEW ================= -->
<div id="viewSettings" class="settings-wrap" style="display:none"></div>

/* ---------------- state ---------------- */
var KEY="tco_app_v2", DKEY="tco_draft_v2";
var state, draft;

function loadState(){
  try{ var raw=localStorage.getItem(KEY); if(raw){ state=JSON.parse(raw); migrateState(); return; } }catch(e){}
  state=defaults();
  saveState();
}
function migrateState(){
  var changed=false;
  if(!state.ai){ state.ai={apiKey:"",model:"claude-sonnet-5"}; changed=true; }
  if(!svcById("other")){ state.services.push(defaults().services.filter(function(s){return s.id==="other";})[0]); changed=true; }
  if(changed) saveState();
}
function saveState(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function loadDraft(){
  try{
    var raw=localStorage.getItem(DKEY);
    if(raw){
      draft=JSON.parse(raw);
      /* migrate v2 draft (single serviceId + flat sections) */
      if(draft && draft.serviceId && !draft.serviceIds){
        var svc=svcById(draft.serviceId);
        draft.serviceIds=[draft.serviceId];
        draft.svc=[{id:draft.serviceId, name:(svc?svc.name:"Service"), sections:draft.sections||{}}];
        delete draft.serviceId; delete draft.sections;
        saveDraft();
      }
      if(draft && !draft.serviceIds) draft=null;
      return;
    }
  }catch(e){}
  draft=null;
}
function saveDraft(){ try{ localStorage.setItem(DKEY, JSON.stringify(draft)); }catch(e){} }
function cp(o){ return JSON.parse(JSON.stringify(o)); }
function svcById(id){ for(var i=0;i<state.services.length;i++) if(state.services[i].id===id) return state.services[i]; return null; }
function findPkg(pid){
  for(var i=0;i<state.services.length;i++){
    var ps=state.services[i].packages||[];
    for(var j=0;j<ps.length;j++) if(ps[j].id===pid) return {svc:state.services[i], pkg:ps[j]};
  }
  return null;
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escA(s){ return esc(s).replace(/"/g,"&quot;"); }
function money(n){
  n=Number(n)||0;
  var neg=n<0; n=Math.abs(n);
  n=Math.round(n*100)/100;
  var dec=(n%1!==0)?2:0;
  var s=n.toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:2});
  return (neg?"-$":"$")+s;
}
function uid(){ return "x"+Math.random().toString(36).slice(2,9); }
function lines(v){ var out=[]; v.split("\n").forEach(function(x){ if(x.trim()!=="") out.push(x.trim()); }); return out; }

/* ---------------- draft creation ---------------- */
function comboTitle(ids){
  if(ids.length===1){ var s=svcById(ids[0]); return s?s.docTitle:"Services Agreement"; }
  var names=ids.map(function(id){ var s=svcById(id); return s?s.name:""; }).filter(function(n){ return n && n!=="Other / Custom"; });
  if(!names.length) return "Services Agreement";
  return names.join(" & ")+" Services Agreement";
}
function defaultFeesFor(ids){
  var fees=[], haveOnboarding=false;
  ids.forEach(function(id){
    var svc=svcById(id); if(!svc) return;
    cp(svc.defaultFees||[]).forEach(function(f){
      var isOnb=/onboarding/i.test(f.label||"");
      if(isOnb){ if(haveOnboarding) return; haveOnboarding=true; }
      fees.push(f);
    });
  });
  return fees;
}
function newDraft(ids){
  draft={
    serviceIds:ids.slice(),
    docTitle:comboTitle(ids),
    client:{business:"", rep:"", effectiveDate:""},
    svc:ids.map(function(id){ var s=svcById(id); return {id:id, name:s.name, sections:cp(s.sections)}; }),
    fees:defaultFeesFor(ids),
    paymentTerms:state.paymentTermsDefault,
    legalOn:{},
    aiNote:""
  };
  for(var i=0;i<state.legal.length;i++) draft.legalOn[state.legal[i].id]=state.legal[i].on;
  saveDraft();
}
function toggleService(id){
  var ids = draft ? draft.serviceIds.slice() : [];
  var at = ids.indexOf(id);
  if(at>=0){
    if(ids.length===1){ /* removing the last service clears the draft */
      if(!confirm("Remove the last service and clear this agreement?")) return;
      draft=null; localStorage.removeItem(DKEY); renderForm(); renderPreview(); return;
    }
    ids.splice(at,1);
  } else ids.push(id);
  if(!draft){ newDraft(ids); renderForm(); renderPreview(); return; }
  /* rebuild wording/services but keep client details, current fees, payment terms, legal toggles */
  var oldIds=draft.serviceIds.slice();
  var keepClient=cp(draft.client), keepTerms=draft.paymentTerms, keepLegal=cp(draft.legalOn);
  var keepFees=draft.fees.filter(function(f){
    if(f.type!=="package") return true;
    var hit=findPkg(f.packageId);
    return hit && ids.indexOf(hit.svc.id)>=0;   /* drop packages of removed services */
  });
  /* a newly added service brings along its default fees (one onboarding fee max) */
  var haveOnboarding=keepFees.some(function(f){ return /onboarding/i.test(f.label||""); });
  ids.filter(function(sid){ return oldIds.indexOf(sid)<0; }).forEach(function(sid){
    var svc=svcById(sid); if(!svc) return;
    cp(svc.defaultFees||[]).forEach(function(f){
      var isOnb=/onboarding/i.test(f.label||"");
      if(isOnb){ if(haveOnboarding) return; haveOnboarding=true; }
      keepFees.push(f);
    });
  });
  /* keep per-service wording edits for services still selected */
  var oldSvc={}; (draft.svc||[]).forEach(function(sv){ oldSvc[sv.id]=sv; });
  newDraft(ids);
  draft.client=keepClient; draft.paymentTerms=keepTerms; draft.legalOn=keepLegal;
  draft.svc=ids.map(function(sid){ return oldSvc[sid]||draft.svc.filter(function(sv){return sv.id===sid;})[0]; });
  draft.fees=keepFees;
  saveDraft(); renderForm(); renderPreview();
}

function catalogForAI(){
  var out="SERVICE CODES:\n";
  state.services.forEach(function(s){ out+="  "+s.id+" = "+s.name+"\n"; });
  out+="PACKAGES (packageId — name — price/month):\n";
  state.services.forEach(function(s){
    (s.packages||[]).forEach(function(p){ out+="  "+p.id+" — "+p.name+" ("+s.name+") — $"+p.price+"\n"; });
  });
  out+="ADD-ON NAMES (with owning package):\n";
  state.services.forEach(function(s){
    (s.packages||[]).forEach(function(p){ (p.addOns||[]).forEach(function(a){ out+="  "+a.name+" ["+p.id+"]\n"; }); });
    (s.sharedAddOns||[]).forEach(function(a){ out+="  "+a.name+" [shared:"+s.id+"]\n"; });
  });
  return out;
}
function buildAIPrompt(notes){
  return "You are helping prepare a client service agreement for TCO (The Contractors Office), a bookkeeping and office-services firm. Read the meeting notes / client message below and extract the details needed to draft the agreement.\n\n"
  + catalogForAI()
  + "\nReply with ONLY a JSON object (no markdown, no commentary) in exactly this shape:\n"
  + '{\n'
  + '  "services": ["bk"],                    // 1 or more service codes from the list above; use "other" if nothing fits\n'
  + '  "client": {"business": "", "rep": "", "effectiveDate": ""},   // effectiveDate as YYYY-MM-DD or ""\n'
  + '  "packageId": null,                      // a packageId from the list if a specific package fits, else null\n'
  + '  "addOns": [],                            // add-on names from the list that the client needs\n'
  + '  "fees": [                                // any custom fees discussed; amount = plain number\n'
  + '    {"type": "onetime|monthly|perunit", "label": "", "amount": 0, "unit": "", "desc": ""}\n'
  + '  ],\n'
  + '  "scopeExtras": [],                       // up to 6 short client-specific scope bullets worth adding (volumes, platforms, special arrangements)\n'
  + '  "summary": ""                            // 2-3 sentences: what you understood and anything unclear\n'
  + '}\n\n'
  + "Rules: only include facts that are actually in the notes; leave fields empty/null when unknown. Do not invent prices.\n\n"
  + "=== NOTES START ===\n" + notes + "\n=== NOTES END ===";
}

function aiUpload(inp){

  };
  rd.onerror=function(){ aiStatus("Couldn't read that file — try a plain text file, or copy-paste the content.","err"); };
  rd.readAsText(f);
  inp.value="";
}
function aiCopyPrompt(){

  var done=function(){
    document.getElementById("aiPasteWrap").open=true;
    aiStatus("Prompt copied. Paste it into claude.ai, then paste Claude's reply into the box below and click Apply.","ok");
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(prompt).then(done,function(){ fallbackCopy(prompt); done(); }); }
  else { fallbackCopy(prompt); done(); }
}
function fallbackCopy(text){
  var ta=document.createElement("textarea");
  ta.value=text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}

/* --- connection to your Claude subscription via the local helper --- */
var HELPER_URL="http://127.0.0.1:8765";
var helperUp=false, lastPing=0;
function paintAIConn(){
  var el=document.getElementById("aiConn"); if(!el) return;
  if(helperUp) el.innerHTML='&#9679; Connected to the <b>Claude helper</b> — one-click drafting runs on your Claude subscription.';
  else if(state.ai.apiKey) el.innerHTML='&#9675; Helper not running — one-click drafting will use your <b>API key</b>. Start "Start TCO AI Helper" to use your subscription instead.';
  else el.innerHTML='&#9675; To draft in one click, start the <b>Claude helper</b> (uses your subscription — see Settings → AI assistant). Zero-setup alternative: "Open claude.ai with prompt".';
}
function pingHelper(force,cb){
  var now=Date.now();
  if(!force && now-lastPing<10000){ paintAIConn(); if(cb)cb(); return; }
  lastPing=now;
  var ctl=(typeof AbortController!=="undefined")?new AbortController():null;
  var t=ctl?setTimeout(function(){ try{ctl.abort();}catch(e){} },900):null;
  fetch(HELPER_URL+"/health",ctl?{signal:ctl.signal}:{})
    .then(function(r){ return r.json(); })
    .then(function(j){ if(t)clearTimeout(t); helperUp=!!(j&&j.ok); paintAIConn(); if(cb)cb(); })
    .catch(function(){ if(t)clearTimeout(t); helperUp=false; paintAIConn(); if(cb)cb(); });
}

function aiDraft(){
  var notes=aiNotesText();
  if(!notes){ aiStatus("Paste or upload your notes first.","err"); return; }
  var prompt=buildAIPrompt(notes);
  var btn=document.getElementById("aiApiBtn"); if(btn) btn.disabled=true;
  var done=function(){ var b=document.getElementById("aiApiBtn"); if(b) b.disabled=false; };
  var tryApi=function(){
    if(!state.ai.apiKey){
      aiStatus('One-click drafting needs the Claude helper running (your subscription — see Settings → AI assistant) or an API key. Zero-setup: click "Open claude.ai with prompt".',"err");
      done(); return;
    }
    aiStatus("Drafting with Claude via your API key…");
    apiDraft(prompt, done);
  };
  var run=function(){
    if(helperUp){
      aiStatus("Drafting with Claude on your subscription (local helper)… this can take up to a minute.");
      fetch(HELPER_URL+"/draft",{method:"POST",headers:{"Content-Type":"text/plain"},body:prompt})
        .then(function(r){ return r.json(); })
        .then(function(j){
          if(j&&j.ok&&j.text){ applyAIResult(j.text); done(); }
          else { aiStatus("Helper reported a problem: "+((j&&j.error)||"unknown error"),"err"); done(); }
        })
        .catch(function(){ helperUp=false; paintAIConn(); tryApi(); });
    } else tryApi();
  };
  pingHelper(true,run);
}
function apiDraft(prompt,done){
  fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "content-type":"application/json",
      "x-api-key":state.ai.apiKey,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body:JSON.stringify({
      model:state.ai.model||"claude-sonnet-5",
      max_tokens:2500,
      messages:[{role:"user",content:prompt}]
    })
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error("API error "+r.status+": "+t.slice(0,200)); });
    return r.json();
  }).then(function(j){
    var text=(j.content&&j.content[0]&&j.content[0].text)||"";
    applyAIResult(text);
  }).catch(function(e){
    var msg=String(e&&e.message||e);
    if(/401|invalid|authentication/i.test(msg)) aiStatus("That API key doesn't seem to work — check it in Settings → AI assistant.","err");
    else if(/Failed to fetch|NetworkError|CSP|blocked/i.test(msg)) aiStatus('Couldn\'t reach the Claude API from here. Use the Claude helper or "Open claude.ai with prompt" instead.',"err");
    else aiStatus("Something went wrong: "+msg,"err");
  }).then(function(){ if(done) done(); });
}
function aiOpenClaude(){
  var notes=aiNotesText();
  if(!notes){ aiStatus("Paste or upload your notes first.","err"); return; }
  var prompt=buildAIPrompt(notes);
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(prompt)["catch"](function(){ fallbackCopy(prompt); }); }
  else fallbackCopy(prompt);
  var url="https://claude.ai/new?q="+encodeURIComponent(prompt);
  if(url.length>7000) url="https://claude.ai/new";
  window.open(url,"_blank");
  var pw=document.getElementById("aiPasteWrap"); if(pw) pw.open=true;
  aiStatus("claude.ai opened in a new tab — the prompt is also in your clipboard (paste it there if the chat is empty). When Claude answers, copy the whole reply into the box below and click Apply.","ok");
}
function applyAIResult(text){
  var raw=String(text||"");
  var a=raw.indexOf("{"), b=raw.lastIndexOf("}");
  if(a<0||b<=a){ aiStatus("That doesn't look like the JSON reply — make sure you paste Claude's full answer.","err"); return; }
  var j;
  try{ j=JSON.parse(raw.slice(a,b+1)); }
  catch(e){ aiStatus("Couldn't read the reply ("+e.message+"). Paste Claude's full answer, starting with { and ending with }.","err"); return; }

  var ids=(Array.isArray(j.services)?j.services:[]).filter(function(id){ return !!svcById(id); });
  if(!ids.length) ids=["other"];
  newDraft(ids);

  var c=j.client||{};
  if(typeof c.business==="string") draft.client.business=c.business;
  if(typeof c.rep==="string") draft.client.rep=c.rep;
  if(typeof c.effectiveDate==="string" && /^\d{4}-\d{2}-\d{2}$/.test(c.effectiveDate)) draft.client.effectiveDate=c.effectiveDate;
  draft.docTitle=comboTitle(ids);

  if(j.packageId){
    var hit=findPkg(j.packageId);
    if(hit && ids.indexOf(hit.svc.id)>=0) draft.fees.unshift({type:"package",packageId:j.packageId,showSpecs:false});
  }
  var chosenPkg=j.packageId?findPkg(j.packageId):null;
  (Array.isArray(j.addOns)?j.addOns:[]).forEach(function(name){
    if(typeof name!=="string"||!name.trim()) return;
    var lower=name.toLowerCase(), resolved=null;
    /* the chosen package's own add-on price wins over other tiers */
    if(chosenPkg&&chosenPkg.pkg.addOns) chosenPkg.pkg.addOns.forEach(function(x){ if(!resolved&&x.name.toLowerCase()===lower) resolved=x; });
    if(!resolved) ids.forEach(function(sid){ (svcById(sid).sharedAddOns||[]).forEach(function(x){ if(!resolved&&x.name.toLowerCase()===lower) resolved=x; }); });
    if(!resolved) ids.forEach(function(sid){ (svcById(sid).packages||[]).forEach(function(p){ (p.addOns||[]).forEach(function(x){ if(!resolved&&x.name.toLowerCase()===lower) resolved=x; }); }); });
    var f={type:"addon",label:name,amount:null,included:false};
    if(resolved && typeof resolved.price==="number") f.amount=resolved.price;
    if(resolved && String(resolved.price).toLowerCase()==="included") f.included=true;
    draft.fees.push(f);
  });
  (Array.isArray(j.fees)?j.fees:[]).forEach(function(f){
    if(!f||["onetime","monthly","perunit"].indexOf(f.type)<0) return;
    draft.fees.push({type:f.type,label:String(f.label||"Fee"),amount:(typeof f.amount==="number"?f.amount:null),unit:String(f.unit||""),desc:String(f.desc||"")});
  });
  var extras=(Array.isArray(j.scopeExtras)?j.scopeExtras:[]).filter(function(x){return typeof x==="string"&&x.trim();}).slice(0,8);
  if(extras.length && draft.svc.length) draft.svc[0].sections.scopeItems=draft.svc[0].sections.scopeItems.concat(extras);

  draft.aiNote=String(j.summary||"Drafted from your notes.");
  saveDraft(); renderForm(); renderPreview();
  var box=document.getElementById("aiCard"); if(box) box.scrollIntoView({behavior:"smooth",block:"start"});
}

function anyAddOns(){
  if(!draft) return false;
  var yes=false;
  draft.fees.forEach(function(f){
    if(f.type==="package"){ var hit=findPkg(f.packageId); if(hit&&hit.pkg.addOns&&hit.pkg.addOns.length) yes=true; }
  });
  draft.serviceIds.forEach(function(id){ var s=svcById(id); if(s&&s.sharedAddOns&&s.sharedAddOns.length) yes=true; });
  return yes;
}

function addOnOptions(){
  var out=[];
  draft.fees.forEach(function(f){
    if(f.type!=="package") return;
    var hit=findPkg(f.packageId);
    if(hit&&hit.pkg.addOns) hit.pkg.addOns.forEach(function(a){ out.push(a); });
  });
  draft.serviceIds.forEach(function(sid){
    var s=svcById(sid);
    (s&&s.sharedAddOns||[]).forEach(function(a){ out.push(a); });
  });
  return out;
}
function projTotals(f){
  var sub=0; (f.items||[]).forEach(function(it){ sub+=(Number(it.qty)||0)*(Number(it.rate)||0); });
  var disc=sub*((Number(f.discountPct)||0)/100);
  return {sub:sub, disc:disc, grand:sub-disc};
}

/* ---- fee mutations ---- */
function addFee(type){
  var f={type:type,label:""};
  if(type==="package"){
    var candidates=[];
    draft.serviceIds.forEach(function(sid){
      var s=svcById(sid);
      (s&&s.packages||[]).forEach(function(p){ candidates.push(p); });
    });
    if(!candidates.length) return;
    var already={}; draft.fees.forEach(function(x){ if(x.type==="package") already[x.packageId]=1; });
    var fresh=candidates.filter(function(p){ return !already[p.id]; });
    var pool=fresh.length?fresh:candidates;
    var pop=pool.filter(function(p){ return p.popular; });
    f.packageId=(pop[0]||pool[0]).id; f.showSpecs=false;
    draft.fees.unshift(f); dirty(true); return;
  }
  if(type==="addon"){ f.amount=null; f.included=false; }
  if(type==="onetime"||type==="monthly"){ f.amount=null; f.desc=""; }
  if(type==="perunit"){ f.amount=null; f.unit=""; f.desc=""; }
  if(type==="seasonal"){ f.tiers=[{label:"",amount:null,note:""},{label:"",amount:null,note:""}]; }
  if(type==="project"){ f.items=[{desc:"",qty:null,rate:null}]; f.discountPct=0; }
  draft.fees.push(f); dirty(true);
}
function insertRate(id){
  if(!id) return;
  var r=null; state.rates.forEach(function(x){ if(x.id===id) r=x; });
  if(!r) return;
  var f={type:r.type,label:r.label,amount:r.amount,desc:r.desc||""};
  if(r.type==="perunit") f.unit=r.unit||"";
  draft.fees.push(f); dirty(true);
}
function pickAddOn(i,idx){
  if(idx==="")return;
  var o=addOnOptions()[Number(idx)];
  if(!o)return;
  draft.fees[i].label=o.name;
  if(typeof o.price==="number"){ draft.fees[i].amount=o.price; draft.fees[i].included=false; }
  else { draft.fees[i].amount=null; draft.fees[i].included=(String(o.price).toLowerCase()==="included"); }
  dirty(true);
}
function updFee(i,k,v){
  if(k==="amount"||k==="discountPct") v=(v===""?null:Number(v));
  draft.fees[i][k]=v;
  if(k==="packageId"||k==="included"||k==="showSpecs") dirty(true); else dirty();
}
function delFee(i){ draft.fees.splice(i,1); dirty(true); }
function moveFee(i,d){ var j=i+d; if(j<0||j>=draft.fees.length)return; var t=draft.fees[i]; draft.fees[i]=draft.fees[j]; draft.fees[j]=t; dirty(true); }
function addTier(i){ draft.fees[i].tiers.push({label:"",amount:null,note:""}); dirty(true); }
function delTier(i,t){ draft.fees[i].tiers.splice(t,1); dirty(true); }
function updTier(i,t,k,v){ if(k==="amount")v=(v===""?null:Number(v)); draft.fees[i].tiers[t][k]=v; dirty(); }
function addProjItem(i){ draft.fees[i].items.push({desc:"",qty:null,rate:null}); dirty(true); }
function delProjItem(i,j){ draft.fees[i].items.splice(j,1); dirty(true); }
function updProjItem(i,j,k,v){
  if(k==="qty"||k==="rate")v=(v===""?null:Number(v));
  draft.fees[i].items[j][k]=v; dirty();
  var it=draft.fees[i].items[j], el=document.getElementById("pline"+i+"_"+j);
  if(el) el.textContent=money((Number(it.qty)||0)*(Number(it.rate)||0));
}
function updClient(k,v){ draft.client[k]=v; dirty(); }
function startOver(){
  if(!confirm("Clear this agreement and start over?")) return;
  var ids=draft.serviceIds.slice(); newDraft(ids); renderForm(); renderPreview();
}

/* dirty(structural) — save + refresh preview; structural=true also re-renders the form pane */
var pvTimer=null;
function dirty(structural){
  saveDraft();
  if(structural){ renderForm(); }
  else {
    var chips=document.getElementById("feeTotals");
    if(chips) chips.innerHTML=renderFeeTotalsChips();
  }
  clearTimeout(pvTimer); pvTimer=setTimeout(renderPreview,120);
}
function renderFeeTotalsChips(){
  if(!draft) return "";
  var t=feeTotals(), h="";
  if(t.monthly>0) h+='<span class="totals-chip">Monthly total: '+money(t.monthly)+' /mo</span>';
  if(t.onetime>0) h+='<span class="totals-chip">One-time total: '+money(t.onetime)+'</span>';
  if(t.variable) h+='<span class="totals-chip">+ per-unit fees billed as incurred</span>';
  if(t.seasonal) h+='<span class="totals-chip">+ seasonal pricing (varies by period)</span>';
  return h;
}
function feeTotals(){
  var t={monthly:0,onetime:0,variable:false,seasonal:false};
  draft.fees.forEach(function(f){
    if(f.type==="package"){ var hit=findPkg(f.packageId); if(hit) t.monthly+=Number(hit.pkg.price)||0; }
    else if(f.type==="addon"){ if(!f.included) t.monthly+=Number(f.amount)||0; }
    else if(f.type==="monthly") t.monthly+=Number(f.amount)||0;
    else if(f.type==="onetime") t.onetime+=Number(f.amount)||0;
    else if(f.type==="perunit") t.variable=true;
    else if(f.type==="seasonal") t.seasonal=true;
    else if(f.type==="project") t.onetime+=projTotals(f).grand;
  });
  return t;
}

function bulletBody(text){
  var out="", ul=false;
  String(text||"").split("\n").forEach(function(ln){
    ln=ln.trim(); if(!ln){ return; }
    if(ln.indexOf("- ")===0||ln.indexOf("• ")===0){
      if(!ul){ out+="<ul>"; ul=true; }
      out+="<li>"+esc(ln.replace(/^[-•]\s*/,""))+"</li>";
    } else {
      if(ul){ out+="</ul>"; ul=false; }
      out+="<p>"+esc(ln)+"</p>";
    }
  });
  if(ul) out+="</ul>";
  return out;
}
function listBlock(intro,items,note){
  var h="";
  if(intro) h+="<p>"+esc(intro)+"</p>";
  if(items&&items.length){ h+="<ul>"; items.forEach(function(x){ h+="<li>"+esc(x)+"</li>"; }); h+="</ul>"; }
  if(note) h+='<p class="note">'+esc(note)+"</p>";
  return h;
}
function fmtDate(d){
  if(!d) return "__________________";
  try{ var p=d.split("-"); var m=["January","February","March","April","May","June","July","August","September","October","November","December"];
    return Number(p[2])+" "+m[Number(p[1])-1]+" "+p[0]; }catch(e){ return d; }
}

function renderFeesDoc(){
  var h="", addonBuf=[], multi=draft.svc.length>1;
  function flushAddons(){
    if(!addonBuf.length) return;
    h+='<h4>Selected Add-Ons</h4><ul>';
    addonBuf.forEach(function(f){
      var pr=f.included?"Included":(money(f.amount)+" per month");
      h+='<li>'+esc(f.label||"Add-on")+' — <span class="price">'+esc(pr)+'</span></li>';
    });
    h+='</ul>'; addonBuf=[];
  }
  draft.fees.forEach(function(f){
    if(f.type==="addon"){ addonBuf.push(f); return; }
    flushAddons();
    if(f.type==="package"){
      var hit=findPkg(f.packageId); if(!hit) return;
      var svcTag=multi?(" ("+esc(hit.svc.name)+")"):"";
      h+='<h4>Selected Package: '+esc(hit.pkg.name)+svcTag+' — <span class="price">'+money(hit.pkg.price)+' '+esc(hit.pkg.cadence)+'</span></h4>';
      if(hit.pkg.includes&&hit.pkg.includes.length){ h+='<p>This package includes:</p><ul>'; hit.pkg.includes.forEach(function(x){ h+='<li>'+esc(x)+'</li>'; }); h+='</ul>'; }
      if(f.showSpecs&&hit.pkg.specs&&hit.pkg.specs.length){ h+='<p><i>Package specifications:</i></p><ul>'; hit.pkg.specs.forEach(function(x){ h+='<li>'+esc(x)+'</li>'; }); h+='</ul>'; }
    }
    else if(f.type==="onetime"){
      h+='<h4>'+esc(f.label||"One-Time Fee")+': <span class="price">'+money(f.amount)+'</span></h4>';
      if(f.desc) h+='<p>'+esc(f.desc)+'</p>';
    }
    else if(f.type==="monthly"){
      h+='<h4>'+esc(f.label||"Monthly Fee")+': <span class="price">'+money(f.amount)+' per month</span></h4>';
      if(f.desc) h+='<p>'+esc(f.desc)+'</p>';
    }
    else if(f.type==="perunit"){
      h+='<h4>'+esc(f.label||"Fee")+': <span class="price">'+money(f.amount)+' per '+esc(f.unit||"unit")+'</span></h4>';
      if(f.desc) h+='<p>'+esc(f.desc)+'</p>';
    }
    else if(f.type==="seasonal"){
      h+='<h4>'+esc(f.label||"Service Fee")+'</h4><ul>';
      (f.tiers||[]).forEach(function(t){
        if(!t.label&&t.amount==null&&!t.note) return;
        h+='<li><b>'+esc(t.label||"Period")+':</b> <span class="price">'+money(t.amount)+' per month</span>'+(t.note?'. '+esc(t.note):"")+'</li>';
      });
      h+='</ul>';
    }
    else if(f.type==="project"){
      h+='<h4>'+esc(f.label||"Project Fee")+'</h4>';
      h+='<table class="proj"><tr><th>Item</th><th class="r">Qty &times; Rate</th><th class="r">Amount</th></tr>';
      (f.items||[]).forEach(function(it){
        if(!it.desc&&it.qty==null&&it.rate==null) return;
        var amt=(Number(it.qty)||0)*(Number(it.rate)||0);
        h+='<tr><td>'+esc(it.desc||"")+'</td><td class="r">'+(Number(it.qty)||0).toLocaleString("en-US")+' &times; '+money(it.rate)+'</td><td class="r">'+money(amt)+'</td></tr>';
      });
      var t=projTotals(f);
      h+='<tr class="sub"><td colspan="2">Subtotal</td><td class="r">'+money(t.sub)+'</td></tr>';
      if(t.disc>0) h+='<tr><td colspan="2">Discount ('+(Number(f.discountPct)||0)+'%)</td><td class="r">&minus;'+money(t.disc)+'</td></tr>';
      h+='<tr class="grand"><td colspan="2">Grand Total Project Fee</td><td class="r">'+money(t.grand)+'</td></tr></table>';
    }
  });
  flushAddons();

  var t=feeTotals();
  if(t.monthly>0||t.onetime>0){
    h+='<div class="feetotals keep">';
    if(t.monthly>0) h+='<p>Total Monthly Fees: <span class="price">'+money(t.monthly)+' per month</span></p>';
    if(t.onetime>0) h+='<p>Total One-Time Fees: <span class="price">'+money(t.onetime)+'</span></p>';
    if(t.variable) h+='<p style="font-weight:400;font-style:italic;font-size:13px">Per-unit fees are billed in addition, based on actual volume.</p>';
    if(t.seasonal) h+='<p style="font-weight:400;font-style:italic;font-size:13px">Seasonal fees apply per the periods listed above.</p>';
    h+='</div>';
  }
  var pt=lines(draft.paymentTerms||"");
  if(pt.length){ h+='<h4>Payment Terms</h4><ul>'; pt.forEach(function(x){ h+='<li>'+esc(x)+'</li>'; }); h+='</ul>'; }
  return h||"<p>—</p>";
}

    h+='<div class="field" style="flex:0 0 auto;display:flex;align-items:flex-end"><div class="checkline" style="margin:0"><input type="checkbox" id="lgo'+L+'" '+(lg.on?"checked":"")+' onchange="updLegal('+L+',\'on\',this.checked)"><label for="lgo'+L+'">On by default</label></div></div></div>';
    h+='<div class="field w100"><label>Wording</label><textarea style="min-height:120px" oninput="updLegal('+L+',\'body\',this.value)">'+esc(lg.body)+'</textarea></div>';
    h+='</div></details>';
  }
  h+='<div class="frow" style="margin-top:10px"><div class="field w100"><label>"Additional Services" clause</label><textarea style="min-height:56px" oninput="state.additionalServicesBody=this.value;saveState()">'+esc(state.additionalServicesBody)+'</textarea></div></div>';
  h+='<div class="frow"><div class="field w100"><label>Acceptance statement</label><textarea style="min-height:56px" oninput="state.acceptance=this.value;saveState()">'+esc(state.acceptance)+'</textarea></div></div>';
  h+='<div class="frow"><div class="field w100"><label>Default payment terms <span class="sub">(one per line)</span></label><textarea style="min-height:56px" oninput="state.paymentTermsDefault=this.value;saveState()">'+esc(state.paymentTermsDefault)+'</textarea></div></div>';
  h+='</div>';

  /* backup */
  h+='<div class="card"><h3 class="set-h">Backup &amp; restore</h3><p class="hint">Everything you set up lives in this browser. Download a backup file to keep it safe or move to another computer.</p>';
  h+='<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" onclick="exportBackup()">Download backup</button>';
  h+='<label class="btn" style="display:inline-flex;align-items:center;cursor:pointer">Restore from backup<input type="file" accept=".json,application/json" style="display:none" onchange="importBackup(this)"></label>';
  h+='<button class="btn danger" onclick="resetAll()">Reset everything to TCO defaults</button></div></div>';

  document.getElementById("viewSettings").innerHTML=h;
}

function svcEditor(i){
  var s=state.services[i], x=s.sections;
  function ta(label,val,path,mh){ return '<div class="field w100"><label>'+label+'</label><textarea style="min-height:'+(mh||44)+'px" oninput="updSvcPath('+i+',\''+path+'\',this.value)">'+esc(val)+'</textarea></div>'; }
  function taList(label,arr,path){ return '<div class="field w100"><label>'+label+' <span class="sub">(one per line)</span></label><textarea oninput="updSvcPathList('+i+',\''+path+'\',this.value)">'+esc((arr||[]).join("\n"))+'</textarea></div>'; }
  var h='<details class="cust"><summary>'+esc(s.name)+'</summary><div class="inner">';
  h+='<div class="frow"><div class="field"><label>Service name</label><input type="text" value="'+escA(s.name)+'" oninput="updSvc('+i+',\'name\',this.value)"></div>';
  h+='<div class="field"><label>Document title</label><input type="text" value="'+escA(s.docTitle)+'" oninput="updSvc('+i+',\'docTitle\',this.value)"></div></div>';

  /* packages */
  if(s.pricingMode==="packages"||s.packages.length){
    h+='<div class="subgroup">Packages</div>';
    for(var p=0;p<s.packages.length;p++){
      var pk=s.packages[p];
      h+='<div class="pkg-box"><div class="frow"><div class="field"><label>Package name</label><input type="text" value="'+escA(pk.name)+'" oninput="updPkg('+i+','+p+',\'name\',this.value)"></div>';
      h+='<div class="field" style="max-width:130px"><label>Price ($/mo)</label><input type="number" step="any" value="'+escA(pk.price)+'" oninput="updPkg('+i+','+p+',\'price\',this.value)"></div>';
      h+='<div class="field" style="flex:0 0 auto;display:flex;align-items:flex-end"><div class="checkline" style="margin:0"><input type="checkbox" id="pop'+i+'_'+p+'" '+(pk.popular?"checked":"")+' onchange="updPkg('+i+','+p+',\'popular\',this.checked)"><label for="pop'+i+'_'+p+'">Most popular</label></div></div>';
      h+='<div class="field" style="flex:0 0 auto;display:flex;align-items:flex-end"><button class="btn sm danger" onclick="delPkg('+i+','+p+')">Delete package</button></div></div>';
      h+='<div class="field w100"><label>What\'s included <span class="sub">(one per line — shown in the agreement)</span></label><textarea oninput="updPkgList('+i+','+p+',\'includes\',this.value)">'+esc((pk.includes||[]).join("\n"))+'</textarea></div>';
      h+='<div class="field w100"><label>Full specifications <span class="sub">(optional, one per line)</span></label><textarea oninput="updPkgList('+i+','+p+',\'specs\',this.value)">'+esc((pk.specs||[]).join("\n"))+'</textarea></div>';
      h+='<div class="field w100"><label>Add-ons for this package <span class="sub">(one per line as: Name = 275 &nbsp;or&nbsp; Name = Included)</span></label><textarea oninput="updPkgAddons('+i+','+p+',this.value)">'+esc(addonsToText(pk.addOns))+'</textarea></div>';
      h+='</div>';
    }
    h+='<button class="btn sm" onclick="addPkg('+i+')">+ Add package</button>';
    h+='<div class="field w100" style="margin-top:10px"><label>Shared add-ons <span class="sub">(available with any package; Name = price per line)</span></label><textarea oninput="updSharedAddons('+i+',this.value)">'+esc(addonsToText(s.sharedAddOns))+'</textarea></div>';
  }

  /* wording */
  h+='<div class="subgroup">Standard wording</div>';
  h+=ta("Scope — opening line",x.scopeIntro,"sections.scopeIntro");
  h+=taList("Scope — bullet points",x.scopeItems,"sections.scopeItems");
  h+=ta("Scope — closing note",x.scopeNote,"sections.scopeNote");
  h+='<div class="checkline"><input type="checkbox" id="pOn'+i+'" '+(x.processOn?"checked":"")+' onchange="updSvcPathBool('+i+',\'sections.processOn\',this.checked)"><label for="pOn'+i+'"><b>Include a "process / parameters" section</b></label></div>';
  h+='<div class="field w100"><label>Process section title</label><input type="text" value="'+escA(x.processTitle)+'" oninput="updSvcPath('+i+',\'sections.processTitle\',this.value)"></div>';
  h+=ta("Process — opening line",x.processIntro,"sections.processIntro");
  h+=taList("Process — bullet points",x.processItems,"sections.processItems");
  h+=ta("Process — closing note",x.processNote,"sections.processNote");
  h+=ta("Limitations — opening line",x.limitIntro,"sections.limitIntro");
  h+=taList("Limitations — bullet points",x.limitItems,"sections.limitItems");
  h+=ta("Limitations — closing note",x.limitNote,"sections.limitNote");
  h+=ta("Responsibilities — opening line",x.respIntro,"sections.respIntro");
  h+=taList("Responsibilities — bullet points",x.respItems,"sections.respItems");
  h+=ta("Responsibilities — closing note",x.respNote,"sections.respNote");
  h+='<div class="checkline"><input type="checkbox" id="sOn'+i+'" '+(x.setupOn?"checked":"")+' onchange="updSvcPathBool('+i+',\'sections.setupOn\',this.checked)"><label for="sOn'+i+'"><b>Include a "systems / setup" section</b></label></div>';
  h+='<div class="field w100"><label>Setup section title</label><input type="text" value="'+escA(x.setupTitle)+'" oninput="updSvcPath('+i+',\'sections.setupTitle\',this.value)"></div>';
  h+=ta("Setup — opening line",x.setupIntro,"sections.setupIntro");
  h+=taList("Setup — bullet points",x.setupItems,"sections.setupItems");
  h+=ta("Setup — closing note",x.setupNote,"sections.setupNote");
  h+=taList("Additional services — examples",x.addlExamples,"sections.addlExamples");
  h+='<div style="margin-top:12px"><button class="btn sm danger" onclick="delService('+i+')">Delete this service</button></div>';
  h+='</div></details>';
  return h;
}

function addonsToText(arr){ return (arr||[]).map(function(a){ return a.name+" = "+a.price; }).join("\n"); }
function textToAddons(v){
  var out=[];
  v.split("\n").forEach(function(ln){
    ln=ln.trim(); if(!ln) return;
    var m=ln.split("=");
    var name=m[0].trim(), price=(m[1]||"").trim();
    if(!name) return;
    var num=Number(price.replace(/[$,\s]/g,""));
    out.push({name:name, price:(price!==""&&!isNaN(num)&&price.replace(/[$,\s]/g,"")!=="")?num:(price||0)});
  });
  return out;
}

/* settings mutations */
function updCo(k,v){ state.company[k]=v; saveState(); applyBrand(); if(k==="logo"||k==="name"||k==="tagline") renderPreview(); }
function uploadLogo(inp){
  var f=inp.files&&inp.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){ state.company.logo=rd.result; saveState(); applyBrand(); renderSettings(); renderPreview(); };
  rd.readAsDataURL(f);
}
function setPath(obj,path,v){
  var parts=path.split("."), o=obj;
  for(var i=0;i<parts.length-1;i++) o=o[parts[i]];
  o[parts[parts.length-1]]=v;
}
function updSvc(i,k,v){ state.services[i][k]=v; saveState(); }
function updSvcPath(i,path,v){ setPath(state.services[i],path,v); saveState(); }
function updSvcPathBool(i,path,v){ setPath(state.services[i],path,!!v); saveState(); }
function updSvcPathList(i,path,v){ setPath(state.services[i],path,lines(v)); saveState(); }
function updPkg(i,p,k,v){ if(k==="price")v=Number(v)||0; if(k==="popular")v=!!v; state.services[i].packages[p][k]=v; saveState(); }
function updPkgList(i,p,k,v){ state.services[i].packages[p][k]=lines(v); saveState(); }
function updPkgAddons(i,p,v){ state.services[i].packages[p].addOns=textToAddons(v); saveState(); }
function updSharedAddons(i,v){ state.services[i].sharedAddOns=textToAddons(v); saveState(); }
function addPkg(i){ state.services[i].packages.push({id:uid(),name:"New Package",price:0,cadence:"per month",popular:false,includes:[],specs:[],addOns:[]}); state.services[i].pricingMode="packages"; saveState(); renderSettings(); }
function delPkg(i,p){ if(!confirm("Delete this package?"))return; state.services[i].packages.splice(p,1); saveState(); renderSettings(); }
function addService(){
  var name=prompt("Name of the new service (e.g. Virtual Assistant Services):"); if(!name) return;
  state.services.push({id:uid(),name:name,docTitle:name+" Agreement",pricingMode:"custom",
    sections:{scopeIntro:"TCO will provide "+name.toLowerCase()+" for the Client. Services include:",scopeItems:[],scopeNote:"All services will be performed in accordance with Client instructions.",
      processOn:false,processTitle:"Process & Parameters",processIntro:"",processItems:[],processNote:"",
      limitIntro:"TCO will not provide:",limitItems:[],limitNote:"When such matters arise, TCO will escalate them to the Client.",
      respIntro:"The Client agrees to provide:",respItems:[],respNote:"Delays in providing required information may impact service timelines.",
      setupOn:false,setupTitle:"Systems & Setup",setupIntro:"",setupItems:[],setupNote:"",addlExamples:[]},
    packages:[],sharedAddOns:[],
    defaultFees:[{type:"onetime",label:"One-Time Onboarding Fee",amount:300,desc:"Due immediately upon acceptance of this Agreement."}]});
  saveState(); renderSettings(); renderForm();
}
function delService(i){
  if(!confirm("Delete the service \""+state.services[i].name+"\" and its packages/wording?")) return;
  var id=state.services[i].id;
  state.services.splice(i,1); saveState();
  if(draft&&draft.serviceIds.indexOf(id)>=0){ draft=null; localStorage.removeItem(DKEY); }
  renderSettings(); renderForm(); renderPreview();
}
function updRate(r,k,v){ if(k==="amount")v=(v===""?null:Number(v)); state.rates[r][k]=v; saveState(); }
function addRate(){ state.rates.push({id:uid(),label:"New rate",type:"onetime",amount:0,unit:"",desc:""}); saveState(); renderSettings(); }
function delRate(r){ state.rates.splice(r,1); saveState(); renderSettings(); }
function updLegal(L,k,v){ if(k==="on")v=!!v; state.legal[L][k]=v; saveState(); }

/* backup */
function exportBackup(){
  var blob=new Blob([JSON.stringify({app:"tco-agreements",version:3,exported:new Date().toISOString(),data:state},null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="TCO-agreement-settings-backup.json";
  a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
}
function importBackup(inp){
  var f=inp.files&&inp.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var j=JSON.parse(rd.result);
      var data=j.data||j;
      if(!data.company||!data.services) throw new Error("Not a TCO backup file");
      if(!confirm("Restore settings from this backup? Your current settings will be replaced.")) return;
      state=data; migrateState(); saveState(); applyBrand(); renderSettings(); renderForm(); renderPreview();
      alert("Backup restored.");
    }catch(e){ alert("Sorry, that file doesn't look like a TCO backup ("+e.message+")."); }
  };
  rd.readAsText(f);
}
function resetAll(){
  if(!confirm("Reset ALL settings (packages, prices, wording, branding) back to the built-in TCO defaults?")) return;
  if(!confirm("Are you sure? Your custom changes will be lost. (Consider downloading a backup first.)")) return;
  state=defaults(); saveState();
  draft=null; localStorage.removeItem(DKEY);
  applyBrand(); renderSettings(); renderForm(); renderPreview();
}

/* =====================================================================
   shell
   ===================================================================== */
function applyBrand(){
  var r=document.documentElement;
  r.style.setProperty("--navy",state.company.colorPrimary||"#052B6A");
  r.style.setProperty("--lime",state.company.colorAccent||"#8EB91A");
  var tl=document.getElementById("topLogo");
  if(state.company.logo){ tl.src=state.company.logo; tl.style.display=""; } else tl.style.display="none";
  document.getElementById("topTag").textContent=state.company.tagline||"";
}
function showView(v){
  document.getElementById("viewNew").style.display=(v==="new")?"flex":"none";
  document.getElementById("viewSettings").style.display=(v==="settings")?"block":"none";
  document.getElementById("tabNew").className=(v==="new")?"active":"";
  document.getElementById("tabSettings").className=(v==="settings")?"active":"";
  if(v==="settings") renderSettings();
  else { renderForm(); renderPreview(); }
}
function doPrint(){
  if(!draft){ alert("Choose a service and fill in the agreement first."); return; }
  var old=document.title;
  var nm=(draft.client.business||"Client").replace(/[\\/:*?"<>|]/g,"");
  document.title=nm+" - "+(draft.docTitle||"Agreement");
  window.print();
  setTimeout(function(){ document.title=old; },500);
}

/* boot */
loadState(); loadDraft();
applyBrand();
renderForm(); renderPreview();
pingHelper(true);
</script>
