name: Build desktop apps

on:
  push:
    tags: ['v*']
    branches: ['claude/tco-proposal-generator-plan-mjyaqi']
    paths: ['RELEASE']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z)'
        required: false
        default: 'v1.1.3'

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tooling
        run: npm install --no-save @electron/packager electron
      - name: Package Windows
        run: |
          EV=$(node -p "require('electron/package.json').version")
          npx electron-packager ./electron "TCO Agreement Generator" --platform=win32 --arch=x64 --icon=electron/tco.ico --out=dist --overwrite --electron-version=$EV
          cd dist
          mv "TCO Agreement Generator-win32-x64" "TCO Agreement Generator"
          zip -qry "../TCO-Agreement-Generator-Windows.zip" "TCO Agreement Generator"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: TCO-Agreement-Generator-Windows.zip

  mac:
    # Packaged with electron-builder on a real Mac: it ad-hoc signs every
    # nested helper with the correct entitlements (a blunt `codesign --deep`
    # breaks Electron's helper processes and the app crashes on launch).
    # A smoke test then LAUNCHES the packaged app before it can be released.
    # Pinned to macos-26: the user runs macOS 26, and v1.1.2 launched fine
    # on the macOS 15 runner yet crashed on 26 — test on what users run.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tooling
        run: npm install --no-audit --no-fund
      # Electron 33 runs on macOS 10.15+ (newest Electron requires a much
      # newer macOS and crashes at launch on older systems).
      - name: Package (unsigned .app bundles)
        run: npx electron-builder --mac dir --arm64 --x64 --publish never -c.electronVersion=33.4.11
      - name: Ad-hoc sign with @electron/osx-sign (handles every helper correctly)
        run: |
          npm install --no-save @electron/osx-sign@1
          node ci/sign-mac.js "dist/mac-arm64/TCO Agreement Generator.app" "dist/mac/TCO Agreement Generator.app"
          codesign --verify --deep --strict "dist/mac-arm64/TCO Agreement Generator.app"
          codesign --verify --deep --strict "dist/mac/TCO Agreement Generator.app"
      - name: Smoke test — launch Apple Silicon app
        run: |
          npm install --no-save playwright-core
          node ci/smoke-mac.js "dist/mac-arm64/TCO Agreement Generator.app/Contents/MacOS/TCO Agreement Generator"
      - name: Ensure Rosetta 2 is present
        continue-on-error: true
        run: |
          arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      # Rosetta on the macos-26 arm64 image is unreliable (Apple is sunsetting
      # it); the Intel launch check is best-effort there. The arm64 check
      # above remains a hard gate.
      - name: Smoke test — launch Intel app under Rosetta (best-effort)
        continue-on-error: true
        run: node ci/smoke-mac.js "dist/mac/TCO Agreement Generator.app/Contents/MacOS/TCO Agreement Generator"
      - name: Zip with Fix-and-Open helper (ditto preserves bundle metadata)
        run: |
          for d in dist/mac-arm64 dist/mac; do
            cp ci/fix-and-open-command.sh "$d/Fix and Open (Mac).command"
            chmod +x "$d/Fix and Open (Mac).command"
          done
          (cd dist/mac-arm64 && ditto -c -k --sequesterRsrc . "../../TCO-Agreement-Generator-Mac-AppleSilicon.zip")
          (cd dist/mac       && ditto -c -k --sequesterRsrc . "../../TCO-Agreement-Generator-Mac-Intel.zip")
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            TCO-Agreement-Generator-Mac-AppleSilicon.zip
            TCO-Agreement-Generator-Mac-Intel.zip

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag (dispatch input, else RELEASE file, else ref)
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [ -f RELEASE ]; then TAG=$(head -1 RELEASE | tr -d ' \r\n'); fi
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: TCO Agreement Generator ${{ steps.ver.outputs.tag }}
          body: |
            One program that does it all — agreement generator, PDF export, and
            one-click AI drafting on your Claude subscription (install Claude Code
            from claude.ai/download and sign in once; the app finds it automatically).

            **Windows** — `TCO-Agreement-Generator-Windows.zip`: extract, open the folder,
            double-click `TCO Agreement Generator.exe`. First run: SmartScreen → More info → Run anyway.

            **Mac** — download the ZIP for your Mac (Apple Silicon = M1/M2/M3/M4, otherwise Intel)
            and unzip it. Right-click **Fix and Open (Mac).command** → Open → Open.
            That one step installs the app into Applications and opens it (needed once,
            because this app isn't in Apple's paid developer program — without it macOS
            blocks the app's own components and it quits at launch).
            Already installed but the app won't open? Run that command file once.
            Requires macOS 10.15 (Catalina, 2019) or newer.
          files: |
            TCO-Agreement-Generator-Windows.zip
            TCO-Agreement-Generator-Mac-AppleSilicon.zip
            TCO-Agreement-Generator-Mac-Intel.zip
